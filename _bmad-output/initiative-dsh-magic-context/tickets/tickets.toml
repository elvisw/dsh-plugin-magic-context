[[entry]]
id = 24
type = "story"
title = "Credential-backed embedding key entry for desktop and Android"
description = "Move the remote embedding API key from a user-edited $DSH_HOME/.env to a write-only configuration field backed by the host credential store, shared by DSH Web and Android dsh-go 1.1.0. Keep embedding.apiKeyEnv as the credential reference (role credential-ref, default SILICONFLOW_API_KEY) and add embedding.apiKey as role secret for the native bridge; never persist the value in cordis.patch.yml. Runtime resolves a host-materialized literal apiKey, then ctx.credentials.resolve(apiKeyEnv), then process.env[apiKeyEnv], and reports only configured/unconfigured. The desktop custom card calls ctx.remote.credentials.set/unset and describe, never configForms.mutate for the secret; it shows a write-only input, clears it after save, requires Save before using a changed ref, and degrades to unavailable when the remote namespace is absent. The Android host renders the masked secret field bound to the sibling credential-ref; no custom native client. An empty reference means unset: on a custom preset the desktop writes an explicit empty string (no auth), while the SiliconFlow preset still consults the default environment variable; env fallback is preserved. Submit sentinel-key tests and one desktop plus one Android minimal host gate with a fake OpenAI-compatible endpoint; no real vendor call, no Flutter/host change, no new provider/route/DB, no release or version change in this ticket. Release 0.18.0 stays paused until this ticket is accepted."
verify = "Independent ticket validation passes. npm test (85 files / 1,051 tests), typecheck, check:i18n and build pass. Source inspection shows embedding.apiKey role secret, embedding.apiKeyEnv role credential-ref with a valid default, and runtime precedence literal > credential > env; status returns presence only. Unit tests cover precedence, missing/empty credential, clear, malformed ref, schema roles, redaction, and clearing a stale auth error before deriving state. The desktop custom card writes only through remote.credentials.set/unset, clears the input after save, shows configured/unconfigured, blocks a dirty ref, and never sends the secret through configForms.mutate. One isolated DSH Web gate with a fake authenticated endpoint verifies save without config mutation or provider request, Bearer sentinel on test with 16 dimensions, clear, absence of the sentinel in profile patch/database/log, and an explicit empty reference saved for custom no-auth. Android uses the same schema and passes schema/unit checks; a device was connected, but the native credential field is blocked by dsh-go 1.1.0's bridge not returning credentialRef (https://github.com/ccch1mneyyy/dsh-Go/issues/1493), so Android is not claimed as verified. A separate phone probe verified the shipped local MiniLM WASM (384 dims, 891 ms), not the credential path. No real vendor call, no .env edit by the agent, no host/Flutter change, no release/publish."
