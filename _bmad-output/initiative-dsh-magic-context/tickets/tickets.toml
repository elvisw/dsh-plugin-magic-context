[[entry]]
id = 22
type = "story"
title = "Manual /ctx-wrapup for live history"
description = "Add /ctx-wrapup [messages_to_keep] (default 20, integer 1..1000). The command validates the live surface, previews a range, and writes only a durable wrapup_request:<sessionId> marker {keep, requestedAt, attempts, compartmentIds}; it does not call the LLM or mutate the surface. Marker schema validation requires keep in 1..1000 and a finite requestedAt; malformed values are treated as absent and cleared. The next pre-step reuses the normal execute inputs and runs one forced execute pass named wrapup-pending. It increments and persists attempts on every forced pass (cap 3) before doing work; if compartmentIds is empty it looks for an exact-span compartment created at/after requestedAt (removing the candidate's own coverage before planning) to recover from a failed marker ID write; a different-span automatic run is never adopted. It lands pending drops AND repairs stranded wire results BEFORE re-planning the span and calling the manual Historian with full surface nodes, forcedRange prefix, contextWindow, route/effort, profileCollect, signal and trigger manual. After storing, it writes the ID (best effort; adoption prevents a second historian) and calls runManagementPass with skipForce true and no historian input: remaining drops land, wire repair is idempotent, ALL unlanded compartments publish, facts promote, and baseline refreshes with full recall/profile inputs. refreshBaseline is changed to render only landed compartments so a deferred or rejected digest cannot leak into the baseline while its span is still on the wire. Eligibility is the historian's shared predicate including baseline/covered/placeholder/checkpoint skips; developer counts. keep counts eligible surface entries. The cut prefers the nearest user boundary then is finalized by the extracted historianSpanBounds head/tail pairing rules; final pairing trim wins, so a forcedRange never opens on an orphan tool result or closes on a tool-requesting assistant. Middle system/baseline/covered/compacted/checkpoint is a hard no-op; middle [dropped] is allowed after landing. compactedEntries is prefix.length (physical entries). Failure paths: no LLM/disabled clears the marker; drop landing/wire repair/historian throw/abort clears it; marker write failure after store is recovered by adoption, not a second historian; deferred publish keeps and persists attempts; terminal rejection clears and is not retried; a marker ID absent from listCompartments clears and is not retried; publish success with baseline failure keeps IDs and retries the normal pass without another LLM call; refreshBaseline no-target is baselineOk=false. Exactly one execute (wrapup-pending) pass row is written with wrapup:{compartmentId, trigger:'manual', retainedEligible, compactedEntries}. No new config, schema, client, package, release, profile, real-model or Web gate requirement. Update README command tables (landed drops, force skipped this pass), PARITY (wrapup supported; dream/embed still absent), CHANGELOG and the registration log."
verify = "Independent ticket validation passes. planWrapupRange tests cover default 20, tail placeholders/system/empty/covered not counted, developer counted, leading orphan tool-result skip, user-boundary preference with pairing-safe fallback, middle [dropped] allowed, middle system/compacted no-op, fewer-than-keep no-op, and compactedEntries equal to prefix.length. Tail pairing is delegated to the shared historian predicate and existing historian-terminal suite. Command tests cover default/1/1000/0/1001/non-numeric args, no-op preview, preview counts, marker written once, valid duplicate refused, schema-invalid marker cleared, no session/closed store/marker write failure error receipt, real covered seq and one command-service registration test. Pre-step integration with the fake LLM covers: queued command -> forced execute wrapup-pending -> one manual runHistorian call; one compartment; one pass row with wrapup counts and trigger manual; pending-drop landing before the historian, with the replay containing [dropped] and not the original tool text; no automatic historian on success and after a manual provider failure; marker cleared after success; attempts above the cap clear without a model call; exact-span adoption and different-span rejection; a deferred digest absent from the baseline. Shared wire-repair, terminal rejection, baseline-retry and unpinned-route behavior keep their existing suites; this ticket does not claim a new case for each. npm test (83 files / 994 tests), typecheck and build pass. No real-model smoke, no Web host gate, no package/release/profile/schema/config/client change; no dream or embed work."
