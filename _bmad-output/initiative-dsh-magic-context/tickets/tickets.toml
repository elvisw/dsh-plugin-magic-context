title = "Remote embedding provider and vector-space migration"
description = "Research and specify a remote OpenAI-compatible embedding provider for project-memory semantic search, without implementing it. The current adapter is hard-wired to the local MiniLM vector space (src/core/embedding-local.ts, 384 dims); memory search reads only the dominant space and backfill writes only that space (src/dsh/memory-lane.ts, src/core/memory-search.ts, src/core/vector-lane.ts). Compare upstream Magic Context v0.49.56 (CONFIGURATION.md:689-731; embedding-openai.ts:57-69,141,604-607,645,676-683,725; embedding-probe.ts:50,67,172; embedding-query-deadline.ts:4-36; embedding-identity.ts:26-104; embedding-model-match.ts:53,84) and decide the DSH-specific contract. Required decisions: top-level embedding config versus memory.embedding; provider interface local/openai-compatible/off; dynamic SiliconFlow model discovery via GET /v1/models?sub_type=embedding and manual fallback, with no hardcoded model IDs; dimension discovery via a POST /embeddings probe because the models API does not return dimensions; probe cache and validation; API-key-by-environment-variable; optional query instruction/document prefix; provider identity including endpoint/model/probed dimensions/api-key presence/document prefix, stored as an identity hash in memory_embeddings.model_id; user-level-only embedding config because a project must not redirect the key env or endpoint; target-space migration state machine with a remote-configured-not-started gate over the default-on vectorBackfill, query-time in-memory fill disabled for remote, coverage over active+permanent rows, old local vectors retained, no mixed spaces, partial semantic plus FTS during rebuild, and no local-vector fallback when remote is configured; model-substitution and always-on dimension guards; separate query and background timeouts; 429/SSRF/input-too-long behavior; settings UX for model loading, probe, status, rebuild and rollback, including the current flat-field/no-RPC contract gap and required plugin routes; and the boundary between the shared server implementation and a future dsh-go native UI. Deliverable: _bmad-output/initiative-dsh-magic-context/research-remote-embedding-provider.md with source-level evidence, configuration/UI contract, migration matrix, failure table, acceptance plan and explicit non-goals. This is research only: no runtime, schema, package, release, profile or test change, and no real SiliconFlow key is available (the live probe is a documented blocked check; use a fake OpenAI-compatible server for contract checks)."
verify = "Independent ticket validation passes. The research document cites the current local embedding path, shared-space gate, dominant-space selection and backfill with file:line evidence, and upstream v0.49.56 embedding sources. It records the SiliconFlow models API contract and its response shape, explicitly states that model metadata has no dimensions, and specifies a dimension probe plus cache/validation. It defines a configuration shape, provider identity fields, dynamic model discovery with manual fallback, and no hardcoded model IDs or dimensions. It surveys OpenAI-compatible alternatives and states that one standard-shape implementation covers them: Cloudflare/Gemini/OpenRouter use OpenAI-compatible bases, Azure accepts either api-key or Authorization, Cohere's basic model/input works but dimensions/user/input_type are absent, so Cohere is not selectable in the MVP, and AWS Bedrock's native API is unsupported, and no vendor protocol adapters or SDKs are planned. It defines the target-space migration state machine including remote-configured-not-started and remote-paused, the explicit rebuild gate over default-on vectorBackfill, disabled remote query-time fill, coverage over active+permanent rows, partial semantic/FTS behavior, old-space retention/rollback, memory_embeddings.model_id as the identity hash, and the rule that remote failure never reads local vectors. It covers user-level-only API-key env handling, query/document prefixes, model substitution, dimension mismatch, separate query/background timeouts, 429, SSRF, input-too-long and secret-safe diagnostics. It defines the Settings flow (load models, probe, status, rebuild, rollback), acknowledges the current flat-field/no-RPC contract gap and required plugin routes, zh/en copy expectations, dsh-go boundary and acceptance tests including a fake OpenAI-compatible server with fixture dimensions rather than a production width. It states that a real SiliconFlow probe is blocked without SILICONFLOW_API_KEY and does not claim live success. git diff shows no runtime, test, package, release or profile changes; no implementation authorization."
