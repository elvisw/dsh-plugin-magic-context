type = "story"
title = "Document automatic reclaim in the READMEs"
description = "The T26 rewrite dropped a fact the pre-rewrite README carried: its feature table named the 85% force band, CONTEXT_WINDOW_EXCEEDED reclaim plus retry, and the reduce-guidance nudges. After the rewrite no reader-facing document explains it; docs/configuration.md lists forceThreshold (85) as a number, and the only other mention is a feasibility note. This matters more than a missing detail: the plugin drops tool output without being asked while the README describes only the ctx_reduce path. Requirements: state the drop-lane split (routine reclaim is agent-driven; /ctx-flush lands only rows already queued) without claiming the force band is the only automatic surface rewrite, since compartment publishing and wire repair also rewrite it (reduce-guidance.ts:9-13, pre-step.ts:194-208, management-pass.ts:616-645,771); document the force-band trigger with its qualifiers (current reading at or above forceThreshold, stale reading skipped, /ctx-wrapup pass sets skipForce) (management-pass.ts:705-723, pre-step.ts:756); document the provider-overflow path that publishes ready digests, drops, and retries once, with results preserved when the window is known and dropping cannot fit (index.ts:543-629, emergency.ts:125-141, management-pass.ts:749-766); document the protection window clamp(window x 5%, 8k, 64k) plus the newest protectedToolResults (eight by default) nodes, and that without a known window only the count floor applies; document the tier order read/todowrite/task last, edit-class next, rest first, oldest first only inside a tier; describe the guidance as prompting and never dropping, with both thresholds (tagged tail >= 60k AND unstamped >= 25k, severity 0.2/0.4/0.6, channel-2 at >= 50k and >= 0.75, same band every >= 5 real user turns) (reduce-guidance.ts:20-29,57-95); keep both READMEs at 1 h1 + 12 h2 with no h3 and no new heading; make docs/configuration.md state that forceThreshold starts the force band only and does not govern the overflow path; add one mechanically checkable assertion in an acceptance copy of readme-lint (term, protected-window term, 85% and the word default in one paragraph, with two mutation controls) and an acceptance copy of link-check writing into this ticket's evidence, leaving the T26 originals byte-identical. Scope is documentation plus acceptance scripts: no product code, no new key, no default change, no version bump, no product or host gate."
verify = "A reader can answer three questions from each README alone: does anything drop tool output without a ctx_reduce call, what opens that path, and what is protected when it does. readme-lint reports 0 failures including the new force-band assertion, link-check reports 0 failures, and one read-only review confirms every claim matches the cited source line without overreach. No typecheck, vitest, npm pack, host gate or version bump runs, and the acceptance report states that explicitly."
