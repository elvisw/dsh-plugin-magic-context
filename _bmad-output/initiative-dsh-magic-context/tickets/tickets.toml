[[entry]]
id = 3
type = "story"
title = "#14: post-Historian raw retrieval"
description = "Makes a previously dropped tool result readable through ctx_expand after a real Historian compartment covers the placeholder, without undoing the summary or re-running the tool; the tag path is normally a regression gate (a proven gap may be fixed under Requirement 1), and message (a DSH log event seq, including shadowed events) is a fallback locator for the same dropped item."
verify = "After a real published compartment covers the drop, expanding both the old tag and the original tool/result message seq returns the original content; the published compartment row is unchanged between pre- and post-expand snapshots; the old tag stays spent; message applies only to dropped items, is rejected for non-tool/compacted nodes, and a missing raw source fails explicitly; either host evidence missing means blocked."
covers = []
after = [2]
hitl = false
risk = "high"
refine = true

