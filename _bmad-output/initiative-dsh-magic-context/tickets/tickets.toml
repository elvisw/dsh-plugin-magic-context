[[entry]]
id = 2
type = "story"
title = "#13 A: result-return expand"
description = "Makes ctx_expand return a new result and makes the spent tag a durable no-op; tag is canonical, while tags remains a deprecated multi-tag alias."
verify = "A dropped tag expands to a new result with the original payload; the old tag is already dropped; the new tag can be dropped and expanded; restart and the legacy tags alias work."
covers = []
after = [1]
hitl = false
risk = "high"
refine = true

[[entry]]
id = 3
type = "story"
title = "#14: post-Historian raw retrieval"
description = "Makes a previously dropped tool result readable through ctx_expand after a real Historian compartment covers the placeholder, without undoing the summary or re-running the tool; the tag path is normally a regression gate (a proven gap may be fixed under Requirement 1), and message (a DSH log event seq, including shadowed events) is a fallback locator for the same dropped item."
verify = "After a real published compartment covers the drop, expanding both the old tag and the original tool/result message seq returns the original content; the published compartment row is unchanged between pre- and post-expand snapshots; the old tag stays spent; message applies only to dropped items, is rejected for non-tool/compacted nodes, and a missing raw source fails explicitly; either host evidence missing means blocked."
covers = []
after = [2]
hitl = false
risk = "high"
refine = true

[[entry]]
id = 4
type = "story"
title = "#15: manual ctx-flush"
description = "Adds a /ctx-flush slash command that durably marks current-session pending drops for forced landing on the next preStep, reports requested/pending counts, and starts no Historian/recomp/model call; DSH has no separate injection-cache API to invalidate."
verify = "With pending drops, /ctx-flush reports requested/already-requested/pendingNext and the next request contains the placeholders; empty, repeated, no-session, command-surface-disabled, and storage-failure cases are diagnosable; the flush lane lands no unmarked item, records skips, and makes the same-turn pressure reading stale so the force band cannot reclaim a second batch."
covers = []
after = [2]
hitl = false
risk = "medium"
refine = true

