e, and a 403 from npmjs or shields is recorded as anti-bot rather than a dead link. Results are saved as evidence/link-check.json. One independent reviewer answers only whether a newcomer can install and perform one reclaim from the README alone and whether they can paraphrase what installation and reclaim each did; findings are fixed or recorded in one pass with no second round. No typecheck, vitest, npm pack, host gate or version bump is run, and the report must state that explicitly rather than implying the documentation change was product-tested."
