title = "Android local-vector end-to-end acceptance"
description = "Prove the full local-vector path on a real Android device with the published 0.18.0 package: write memories through ctx_memory, let the maintenance tick backfill vectors with the in-package MiniLM WASM embedder, and require ctx_memory action=search to report a semantic-bearing match (hybrid or semantic) instead of fts-only. The T23/T24 probes only proved the embedder primitive outside the plugin runtime (direct import of lib/core/embedding-local.js with a hand-made cacheDir), so bootstrap, shared-space parity, backfill, vectorised retrieval and restart persistence are all unverified on the phone. Install into an isolated dataDir and memories.db with a test-owned cordis.patch.yml block that is restored byte-for-byte afterwards, pre-seed the three hash-pinned model assets so the device needs no HuggingFace access, keep the engine's own model route untouched, and record redacted evidence only. This is an acceptance ticket: no product code change, no version bump, no vendor call; defects found are recorded and filed separately rather than fixed here."
