type = "story"
title = "Magic Context settings page, Chinese copy, and reasoning effort picker"
description = "Add a top-level Settings > Magic Context page through settings.section (id magic-context, order 30, locale-backed label), keeping the existing Plugins-page entries as a compatibility fallback. Localize the entire settings card through ctx.locale and the slot props.t: all field labels/hints, route Auto captions and placeholders, summary, form frame and picker copy must exist in both zh and en with no hardcoded Chinese outside the zh dictionary. Replace the free-text Historian reasoning effort field with a catalog-backed picker: extend the existing single remote.session.modelCatalog() read to keep reasoning.efforts/defaultEffort, derive options from the pinned Historian route, include Default (unset), preserve unknown/legacy values as Custom without alias/clamp, use Default-only when the model advertises no efforts, and keep plain text for Auto/unavailable catalog. No runtime pass-through, schema, host-store or release change; an unsupported id must still fail explicitly. Add the current docs/dsh-plugin-settings-ui-contract.md so T14 can mark the old config UI contract historical and link it."
