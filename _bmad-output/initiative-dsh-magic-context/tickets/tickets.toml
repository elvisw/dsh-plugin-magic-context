description = "Implement the T19 research contract for an opt-in remote OpenAI-compatible embedding provider while preserving local MiniLM as the default. Add a top-level, user-level volatile embedding block (provider local/openai-compatible/off, preset siliconflow/custom, endpoint, authHeader, model, apiKeyEnv, dimensions, queryInstruction, documentPrefix, timeoutMs, queryTimeoutMs, batchSize; no maxInputTokens until a remote tokenizer exists). Add a remote provider module that lists models through the preset descriptor (SiliconFlow /models?sub_type=embedding, custom /models, manual fallback), probes dimensions through POST /embeddings and caches them, embeds batches with auth-header selection, optional dimensions, query/document prefixes, all-missing-index array-order mapping, partial/duplicate rejection, tolerant served-model matching, always-on width guard, separate query/background deadlines, 429 Retry-After, no redirects, endpoint/DNS SSRF guards, and sanitized errors; isolate input-too-long rows. Integrate with memory-lane/memory-search/vector-lane: local identity and local target remain explicit (legacy local dominant only); remote identity is namespaced embedding-remote:<hash> and stored in memory_embeddings.model_id; remote search never mixes local vectors and never calls the embedTexts in-memory fill; remote query is FTS-only until an armed rebuild state exists and has at least one target row, so saving config spends no quota; remote writes are allowed for running and complete (target maintenance), not paused or not-started; coverage covers active+permanent searchable rows while local measureVectorLane stays active-only; start requires saved model+dims and triggers one bounded pass; pause/resume; rollback calls a state-only disarm and stages provider=local through the existing revision-fenced Save (no route writes config), so re-saving the same remote target without a new start stays not-started. Add guarded /mc-embedding status/models/probe/rebuild route